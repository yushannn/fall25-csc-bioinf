name: Week 2 - Bio.motifs Port

on:
  push:
    branches: [ main ]
    paths:
      - 'week2/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'week2/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
    - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
    - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
    
    - name: Check out repository code
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install biopython numpy matplotlib
        
    - name: Install Codon (optional for CI)
      run: |
        # Try to install Codon, but don't fail if it doesn't work
        mkdir -p ${HOME}/.codon || true
        curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz | tar zxvf - --strip-components=1 -C ${HOME}/.codon || echo "Codon installation failed, continuing with Python-only tests"
        export PATH=${PATH}:${HOME}/.codon/bin
        echo "PATH=${PATH}" >> $GITHUB_ENV
        
    - name: Verify installations
      run: |
        python --version
        python -c "import Bio; print('BioPython version:', Bio.__version__)"
        codon --version 2>/dev/null || echo "Codon not available, will run Python-only tests"
        
    - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
    - run: echo "🖥️ The workflow is now ready to test your code on the runner."
    
    - name: Run Week 2 Test Suite
      run: |
        cd week2
        echo "Running Week 2 tests with Python..."
        python test.py
        
    - name: Validate Codon installation (optional)
      run: |
        cd week2
        echo "Checking Codon availability..."
        if command -v codon &> /dev/null; then
          echo "✅ Codon is available: $(codon --version 2>/dev/null || echo 'version check failed')"
          echo "Note: Codon-specific performance tests would be run here in a full implementation"
        else
          echo "ℹ️ Codon not available - this is acceptable for CI"
          echo "ℹ️ Week 2 implementation supports both Python and Codon environments"
        fi